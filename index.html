<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงสต๊อกสินค้าครั้งแรกด้วย QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    /* ปรับแต่งปุ่มสลับกล้องของไลบรารีให้ดูง่ายขึ้น */
    #reader button {
      background-color: #4b5563; color: white; padding: 6px 12px; border-radius: 6px; margin: 5px; font-size: 14px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 font-sans">

  <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-xl border border-slate-100 mt-2">
    <div class="text-center mb-5">
      <h2 class="text-2xl font-black text-blue-600">📦 ลงสต๊อกสินค้าครั้งแรก</h2>
      <p class="text-sm text-slate-500 mt-1">สแกน QR Code หรือบาร์โค้ด เพื่อบันทึกชื่อและราคาสินค้า</p>
    </div>
    
    <div class="mb-5">
      <div id="reader" class="w-full rounded-xl overflow-hidden border border-slate-300 bg-slate-900 shadow-inner"></div>
      <p id="scan-status" class="text-xs text-center mt-2 text-slate-500 font-medium">📷 กำลังเปิดกล้องสแกน...</p>
    </div>

    <form id="productForm" onsubmit="submitForm(event)">
      
      <div class="mb-3">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">รหัสบาร์โค้ด / QR Code</label>
        <input type="text" id="barcode" class="w-full p-2.5 bg-slate-100 border border-slate-300 rounded-lg font-mono font-bold text-blue-700 shadow-sm" readonly required placeholder="[ นำกล้องไปส่องสแกนรหัส ]">
      </div>

      <div class="mb-3">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ชื่อสินค้า (ชื่อขนม)</label>
        <input type="text" id="productName" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="เช่น ขนมปังเนยสด, เทสโต">
      </div>

      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ราคาต้นทุน (บาท)</label>
          <input type="number" id="productCost" step="0.01" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="0.00">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ราคาขาย (บาท)</label>
          <input type="number" id="productPrice" step="0.01" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="0.00">
        </div>
      </div>

      <div class="mb-5">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">จำนวนสต๊อกเริ่มต้น (ชิ้น/ห่อ)</label>
        <input type="number" id="productStock" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="เช่น 10, 20, 50">
      </div>

      <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl shadow-lg shadow-blue-200 transition duration-200 cursor-pointer">
        💾 เพิ่มสินค้าเข้าคลัง
      </button>
    </form>
  </div>

  <script>
    let html5QrcodeScanner;

    window.addEventListener('DOMContentLoaded', () => {
      startScanner();
    });

    function startScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 15, 
        qrbox: { width: 250, height: 180 },
        rememberLastUsedCamera: true
      });
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
      document.getElementById('scan-status').innerText = "🔮 นำรหัส QR Code หรือบาร์โค้ดมาส่องหน้ากล้องได้เลย";
    }

    function onScanSuccess(decodedText, decodedResult) {
      if (navigator.vibrate) navigator.vibrate(100); // สั่นเตือนสั้นๆ ถ้ามือถือทำได้
      
      document.getElementById('barcode').value = decodedText;
      document.getElementById('scan-status').innerText = "✅ สแกนรหัสสำเร็จ! กรุณากรอกข้อมูลขนมด้านล่างต่อ";
      document.getElementById('scan-status').className = "text-xs text-center mt-2 text-green-600 font-bold";
    }

    function onScanFailure(error) {
      // ปล่อยผ่านเพื่อให้สแกนเฟรมถัดไปเรื่อยๆ อัตโนมัติ
    }

    function submitForm(e) {
      e.preventDefault();
      
      const barcode = document.getElementById('barcode').value;
      if(!barcode) {
        alert("⚠️ กรุณาสแกนรหัสสินค้าก่อนกดบันทึกครับ");
        return;
      }

      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.innerText = "⏳ กำลังบันทึกข้อมูลสินค้าลงชีต...";
      btnSubmit.disabled = true;

      const productData = {
        barcode: barcode,
        name: document.getElementById('productName').value,
        cost: document.getElementById('productCost').value,
        price: document.getElementById('productPrice').value,
        stock: document.getElementById('productStock').value
      };

      // ส่งคำสั่งข้ามไปที่ฟังก์ชันฝั่ง Code.gs
      google.script.run
        .withSuccessHandler(function(response) {
          alert(response.message);
          if(response.success) {
            // เคลียร์ฟอร์ม ยกเว้นตัวสแกน เพื่อรอสแกนชิ้นถัดไป
            document.getElementById('productForm').reset();
            document.getElementById('barcode').value = "";
            document.getElementById('scan-status').innerText = "🔮 นำรหัส QR Code หรือบาร์โค้ดชิ้นต่อไปมาส่องได้เลย";
            document.getElementById('scan-status').className = "text-xs text-center mt-2 text-slate-500 font-medium";
          }
          btnSubmit.innerText = "💾 เพิ่มสินค้าเข้าคลัง";
          btnSubmit.disabled = false;
        })
        .withFailureHandler(function(error) {
          alert("❌ เกิดข้อผิดพลาดของระบบ: " + error.message);
          btnSubmit.innerText = "💾 เพิ่มสินค้าเข้าคลัง";
          btnSubmit.disabled = false;
        })
        .registerNewProduct(productData);
    }
  </script>
</body>
</html>
